name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读取 pyproject.toml）"
        required: false
        default: ""
      python_versions:
        description: "离线包目标 Python 版本（逗号分隔，覆盖 env 默认值）"
        required: false
        default: ""
      platforms:
        description: "离线包目标平台：linux-x64 / linux-arm64 / win-x64 / win-arm64"
        required: false
        default: ""

permissions:
  contents: write

# 提到工作流级别，各 job 共用。
# 用 3.13 而不是 3.12：内网开发环境是 3.13，Windows 产物必须同版本，
# 否则 exe 包里是 cp312 wheel，在 3.13 机器上会报 not a supported wheel on this platform。
env:
  PYTHON_VERSION: "3.13"
  PYTHONIOENCODING: "utf-8"
  # 离线交付包默认覆盖的目标（workflow_dispatch 里可以覆盖）
  OFFLINE_PYTHON_VERSIONS: "3.13"
  OFFLINE_PLATFORMS: "linux-x64,win-x64"
  # 随 windows 离线套件一起带的 Python 安装器（给完全没 Python 的机器）
  PYTHON_INSTALLER: "python-3.13.7-amd64.exe"

jobs:
  # 门禁：测试不过就不发版。放 ubuntu-latest 而不是 windows-latest，
  # 一是快，二是 Linux 上的测试结果在开发机上就能复现，
  # 不会出现「只挂在自己验证不了的平台」这种没法本地排查的情况。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .

      - name: Run tests
        run: python -m pytest tests -q

  # 离线包能不能装：真在容器里 `--no-index` 装一遍再跑测试。
  # 开发机只有一个解释器，本地跑 `pip download` 验证不了「内网装得上」——
  # 踩过：marker 依赖（colorama/exceptiongroup/tomli）没带进去、
  # 同一个包留多个版本时内网 pip backtracking 后报
  # "Package 'setuptools' requires a different Python"。
  test-offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (只用来下载 wheel)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download wheels
        run: |
          python scripts/build_offline_bundle.py \
            --out dist/offline-check \
            --python "${{ env.PYTHON_VERSION }}" \
            --platforms linux-x64 \
            --no-source --skip-project

      - name: Offline install and test in python:${{ env.PYTHON_VERSION }}
        run: |
          # 挂只读 + 拷到容器里再装：避免 root 在 runner 工作区留下 root 属主的
          # *.egg-info（本地这么试过，删都删不掉）
          docker run --rm -v "$PWD:/w:ro" "python:${{ env.PYTHON_VERSION }}-slim" bash -c "
            set -e
            cp -r /w /work && cd /work
            pip install --quiet --no-index --find-links /w/dist/offline-check/wheels -r requirements-dev.txt
            pip install --quiet --no-index --find-links /w/dist/offline-check/wheels -e .
            python -c 'import duckdb; print(\"duckdb\", duckdb.__version__)'
            python -m pytest tests -q
          "

  build:
    needs: [test, test-offline]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("${{ github.event.inputs.version }}") { $v = "${{ github.event.inputs.version }}" }
          Write-Host "version=$v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          python scripts/extract_release_notes.py "${{ steps.ver.outputs.version }}" notes.md
          Write-Host "----- Release notes -----"
          Get-Content notes.md

      - name: Append artifact guide to release notes
        shell: pwsh
        run: |
          # Release 页面上直接写清三个产物给谁用，不然只能对着文件名猜
          python -c "import pathlib; g=pathlib.Path('docs/RELEASE-ASSETS.md').read_text(encoding='utf-8'); p=pathlib.Path('notes.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+chr(10)*2+g, encoding='utf-8')"
          Get-Content notes.md | Select-Object -Last 10

      - name: Download bundled Python installer
        shell: pwsh
        run: |
          # 版本要和 PYTHON_VERSION 对得上，否则离线套件里的 wheel 装不上
          $url = "https://mirrors.huaweicloud.com/python/3.13.7/${{ env.PYTHON_INSTALLER }}"
          Invoke-WebRequest -Uri $url -OutFile "${{ env.PYTHON_INSTALLER }}"
          Get-Item "${{ env.PYTHON_INSTALLER }}" | Select-Object Name, Length

      - name: Build all Windows release artifacts
        shell: pwsh
        run: |
          # -WithSource：离线 zip 里同时带源码与开发依赖，内网可直接二次开发
          ./scripts/build_windows_release.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -PythonInstaller "./${{ env.PYTHON_INSTALLER }}" `
            -WithSource

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: datacompare-windows-${{ steps.ver.outputs.version }}
          path: dist/release/*.zip

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "v$ver"
          # notes.md 由上一步从 CHANGELOG.md 抽出，找不到该版本时会写兑底说明
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "v$ver" --notes-file notes.md
          } else {
            # 重跑同一 tag 时同步刷新标题与说明，避免留着旧的
            gh release edit $tag --title "v$ver" --notes-file notes.md
          }
          gh release upload $tag (Get-ChildItem dist/release/*.zip).FullName --clobber
          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

  # 跨平台离线交付包：wheel + 源码（内网直接部署，也能二次开发）。
  # 放 ubuntu-latest 是因为 `pip download --platform ...` 能一次备齐多平台 wheel，
  # 不需要真的在 Windows/Linux 上各跑一遍。
  offline-bundle:
    needs: [test, test-offline]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve targets and version
        id: tgt
        run: |
          PYVERS="${{ github.event.inputs.python_versions }}"
          PLATS="${{ github.event.inputs.platforms }}"
          if [ -z "$PYVERS" ]; then PYVERS="$OFFLINE_PYTHON_VERSIONS"; fi
          if [ -z "$PLATS" ]; then PLATS="$OFFLINE_PLATFORMS"; fi

          VER=$(python scripts/build_offline_bundle.py --print-version)
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          fi
          # 打 tag 触发时以 tag 为准（tag 形如 v0.2.0）
          case "${GITHUB_REF_NAME:-}" in
            v*) VER="${GITHUB_REF_NAME#v}" ;;
          esac

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "python=$PYVERS" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATS" >> "$GITHUB_OUTPUT"

          # 产物名要能自解释，否则三个包摆在 Release 上分不清：
          #   py313 / py312-313     目标 Python（需目标机自备）
          #   linux-win             覆盖的平台
          PY_TAG="py$(echo "$PYVERS" | tr ',' '\n' | sed 's/\.//g' | paste -sd- -)"
          PLAT_TAG="$(echo "$PLATS" | tr ',' '\n' | while read -r p; do
            case "$p" in
              *win*)   echo win ;;
              *linux*) echo linux ;;
              *)       echo "$p" ;;
            esac
          done | sort -u | paste -sd- -)"
          echo "tag=$PY_TAG-$PLAT_TAG" >> "$GITHUB_OUTPUT"
          echo "目标：datacompare $VER / Python $PYVERS / $PLATS → wheels-src-$PY_TAG-$PLAT_TAG"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # 打包脚本要 import duckdb 才会顺手下载 DuckDB 扩展
          pip install -r requirements.txt

      - name: Build offline bundle (wheels + source)
        run: |
          python scripts/build_offline_bundle.py \
            --out dist/offline-bundle \
            --python "${{ steps.tgt.outputs.python }}" \
            --platforms "${{ steps.tgt.outputs.platforms }}" \
            --with-extensions \
            --zip
          mv dist/offline-bundle.tar.gz \
             "dist/datacompare-${{ steps.tgt.outputs.version }}-wheels-src-${{ steps.tgt.outputs.tag }}.tar.gz"
          ls -lh dist/*.tar.gz

      - name: Show MANIFEST
        run: cat dist/offline-bundle/MANIFEST.txt

      - name: Upload artifact (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: datacompare-wheels-src-${{ steps.tgt.outputs.version }}
          path: dist/datacompare-*-wheels-src-*.tar.gz
          retention-days: 30

      - name: Upload asset to GitHub Release
        # 只在打 tag 时挂到 Release 上；手动触发就只留 workflow artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 两个 job 并行跑，Release 可能还没被 windows 那个 job 建出来
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/datacompare-*-wheels-src-*.tar.gz --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
