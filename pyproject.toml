[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacompare"
version = "0.3.2"
description = "前后数据集全字段对比工具：出对比报告、定位异常数据，大文件落 DuckDB"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.1.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
datacompare = "datacompare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
